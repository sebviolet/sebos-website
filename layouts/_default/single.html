{{ define "main" }}
<article class="post-container">
  <header class="post-header">
    <div class="card-meta">
      <span class="badge badge-{{ .Type }}">{{ .Type }}</span>
      <time datetime="{{ .Date.Format " 2026-01-02"
        }}">{{ .Date.Format (.Site.Params.dateFormat | default "02/01/2026") }}</time>
    </div>
    <h1 class="post-title" style="font-size: 2.5rem; font-weight: 800; margin: 0.5rem 0 1rem 0;">{{ .Title }}</h1>
  </header>

  {{ with .Params.coverImage }}
  <div class="post-cover">
    {{ partial "responsive-image.html" (dict "src" . "alt" $.Title "class" "post-cover-image") }}
  </div>
  {{ end }}

  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
