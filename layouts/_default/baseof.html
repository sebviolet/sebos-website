<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "fr-FR" }}">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.description }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

    <!-- Favicons -->
    <link rel="icon" href="{{ "favicon.png" | relURL }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ "favicon.png" | relURL }}">

    {{ partial "seo.html" . }}

    {{ $style := resources.Get "css/main.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
  </head>

  <body>
    {{ partial "header.html" . }}

    <main class="main-content">
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}
  </body>

</html>
