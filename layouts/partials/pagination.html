{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
<nav class="pagination" style="display: flex; gap: 1rem; margin-top: 2rem;">
  {{ if $paginator.HasPrev }}
  <a href="{{ $paginator.Prev.URL }}" class="pagination-prev">&laquo; Page précédente</a>
  {{ end }}

  <span>Page {{ $paginator.PageNumber }} sur {{ $paginator.TotalPages }}</span>

  {{ if $paginator.HasNext }}
  <a href="{{ $paginator.Next.URL }}" class="pagination-next">Page suivante &raquo;</a>
  {{ end }}
</nav>
{{ end }}
